
<!DOCTYPE html>
<html lang="en">

<head>
    <!-- Basic Meta Tags -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="TaskFlow - Manage your daily tasks efficiently.">

    <title>TaskFlow | Task Management Dashboard</title>

    <!-- Custom CSS -->
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Main Layout -->
    <div class="app-container">

        <!-- Sidebar -->
        <aside class="sidebar">
            <div class="logo">
                <span class="logo-icon">✓</span>
                <h2>Task<span>Flow</span></h2>
            </div>

            <nav class="sidebar-menu" aria-label="Main navigation">
                <a href="#dashboard" class="menu-item active">Dashboard</a>
                <a href="#tasks" class="menu-item">My Tasks</a>
                <a href="#progress" class="menu-item">Progress</a>
            </nav>

            <div class="sidebar-footer">
                <p>TaskFlow © 2026</p>
            </div>
        </aside>

        <!-- Main Content -->
        <main class="main-content" id="dashboard">

            <!-- Dashboard Header -->
            <header class="top-header">
                <div class="header-left">
                    <p class="welcome-text">Welcome to TaskFlow</p>
                    <h1>Task Dashboard</h1>
                    <p>Organize and manage your daily tasks.</p>
                </div>

                <div class="header-right">
                    <div class="search-box">
                        <input
                            type="search"
                            id="searchInput"
                            placeholder="Search tasks..."
                            aria-label="Search tasks"
                        >
                        <button
                            type="button"
                            id="clearSearchBtn"
                            aria-label="Clear search"
                            hidden
                        >
                            &times;
                        </button>
                    </div>

                    <button type="button" id="addTaskBtn">
                        + Add Task
                    </button>
                </div>
            </header>

            <!-- Task Summary -->
            <section class="dashboard-summary" id="progress">

                <div class="summary-card">
                    <div class="summary-icon">📋</div>
                    <h3>Total Tasks</h3>
                    <p id="totalTasks">0</p>
                </div>

                <div class="summary-card">
                    <div class="summary-icon">⏳</div>
                    <h3>In Progress</h3>
                    <p id="progressTasks">0</p>
                </div>

                <div class="summary-card">
                    <div class="summary-icon">✅</div>
                    <h3>Completed</h3>
                    <p id="completedTasks">0</p>
                </div>

            </section>

            <!-- Search Results -->
            <div class="search-results" id="searchResults" hidden>
                <p id="searchResultText"></p>
            </div>

            <!-- Kanban Board -->
            <section class="kanban-board" id="tasks">

                <!-- To Do Column -->
                <div class="task-column" data-status="todo">
                    <div class="column-header">
                        <h2>
                            <span class="status-dot todo-dot"></span>
                            To Do
                        </h2>
                        <span class="task-count" id="todoCount">0</span>
                    </div>

                    <div class="task-list" id="todoTasks"></div>
                </div>

                <!-- In Progress Column -->
                <div class="task-column" data-status="progress">
                    <div class="column-header">
                        <h2>
                            <span class="status-dot progress-dot"></span>
                            In Progress
                        </h2>
                        <span class="task-count" id="progressCount">0</span>
                    </div>

                    <div class="task-list" id="inProgressTasks"></div>
                </div>

                <!-- Completed Column -->
                <div class="task-column" data-status="completed">
                    <div class="column-header">
                        <h2>
                            <span class="status-dot completed-dot"></span>
                            Completed
                        </h2>
                        <span class="task-count" id="completedCount">0</span>
                    </div>

                    <div class="task-list" id="completedTasksList"></div>
                </div>

            </section>

            <!-- Empty Search State -->
            <div class="empty-search" id="emptySearch" hidden>
                <div class="empty-icon">🔍</div>
                <h3>No tasks found</h3>
                <p>Try searching with another keyword.</p>
            </div>

        </main>
    </div>

    <!-- Add and Edit Task Modal -->
    <div class="modal" id="taskModal" hidden>
        <div
            class="modal-content"
            role="dialog"
            aria-modal="true"
            aria-labelledby="modalTitle"
        >

            <!-- Modal Header -->
            <div class="modal-header">
                <h2 id="modalTitle">Add New Task</h2>

                <button
                    type="button"
                    id="closeModal"
                    aria-label="Close task form"
                >
                    &times;
                </button>
            </div>

            <!-- Task Form -->
            <form id="taskForm">

                <input type="hidden" id="editingTaskId">

                <div class="form-group">
                    <label for="taskTitle">Task Title</label>
                    <input
                        type="text"
                        id="taskTitle"
                        placeholder="Enter task title"
                        maxlength="100"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="taskDescription">Description</label>
                    <textarea
                        id="taskDescription"
                        rows="4"
                        placeholder="Enter task description"
                    ></textarea>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="taskCategory">Category</label>
                        <select id="taskCategory">
                            <option value="Development">Development</option>
                            <option value="Design">Design</option>
                            <option value="Personal">Personal</option>
                            <option value="Other">Other</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="taskPriority">Priority</label>
                        <select id="taskPriority">
                            <option value="low">Low</option>
                            <option value="medium" selected>Medium</option>
                            <option value="high">High</option>
                        </select>
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="taskDueDate">Due Date</label>
                        <input type="date" id="taskDueDate">
                    </div>

                    <div class="form-group">
                        <label for="taskStatus">Status</label>
                        <select id="taskStatus">
                            <option value="todo">To Do</option>
                            <option value="progress">In Progress</option>
                            <option value="completed">Completed</option>
                        </select>
                    </div>
                </div>

                <!-- Form Actions -->
                <div class="modal-actions">
                    <button
                        type="button"
                        id="cancelTaskBtn"
                        class="cancel-btn"
                    >
                        Cancel
                    </button>

                    <button
                        type="submit"
                        id="saveTaskBtn"
                        class="save-btn"
                    >
                        Save Task
                    </button>
                </div>

            </form>
        </div>
    </div>

    <!-- JavaScript -->
    <script src="script.js"></script>
</body>

</html>
