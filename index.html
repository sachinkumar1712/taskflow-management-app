
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="TaskFlow - Manage your daily tasks efficiently.">
    <title>TaskFlow | Task Management Dashboard</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Main Layout -->
    <div class="app-container">

        <!-- Sidebar -->
        <aside class="sidebar">
            <div class="logo">
                <span class="logo-icon">✓</span>
                <h2>Task<span>Flow</span></h2>
            </div>

            <nav class="sidebar-menu">
                <a href="#dashboard" class="menu-item active">Dashboard</a>
                <a href="#tasks" class="menu-item">My Tasks</a>
                <a href="#progress" class="menu-item">Progress</a>
            </nav>

            <div class="sidebar-footer">
                <p>TaskFlow © 2026</p>
            </div>
        </aside>

        <!-- Main Content -->
        <main class="main-content" id="dashboard">

            <!-- Dashboard Header -->
            <header class="top-header">
                <div class="header-left">
                    <p class="welcome-text">Welcome to TaskFlow</p>
                    <h1>Task Dashboard</h1>
                    <p>Organize and manage your daily tasks.</p>
                </div>

                <div class="header-right">
                    <input
                        type="search"
                        id="searchInput"
                        placeholder="Search tasks..."
                        aria-label="Search tasks"
                    >
                    <button id="addTaskBtn" type="button">+ Add Task</button>
                </div>
            </header>

            <!-- Task Summary -->
            <section class="dashboard-summary" id="progress">
                <div class="summary-card">
                    <div class="summary-icon total-icon">📋</div>
                    <h3>Total Tasks</h3>
                    <p id="totalTasks">0</p>
                </div>

                <div class="summary-card">
                    <div class="summary-icon progress-icon">⏳</div>
                    <h3>In Progress</h3>
                    <p id="progressTasks">0</p>
                </div>

                <div class="summary-card">
                    <div class="summary-icon completed-icon">✅</div>
                    <h3>Completed</h3>
                    <p id="completedTasks">0</p>
                </div>
            </section>

            <!-- Kanban Board -->
            <section class="kanban-board" id="tasks">

                <!-- To Do Column -->
                <div class="task-column" data-status="todo">
                    <div class="column-header">
                        <h2><span class="status-dot todo-dot"></span> To Do</h2>
                        <span class="task-count" id="todoCount">0</span>
                    </div>
                    <div class="task-list" id="todoTasks"></div>
                </div>

                <!-- In Progress Column -->
                <div class="task-column" data-status="progress">
                    <div class="column-header">
                        <h2><span class="status-dot progress-dot"></span> In Progress</h2>
                        <span class="task-count" id="progressCount">0</span>
                    </div>
                    <div class="task-list" id="inProgressTasks"></div>
                </div>

                <!-- Completed Column -->
                <div class="task-column" data-status="completed">
                    <div class="column-header">
                        <h2><span class="status-dot completed-dot"></span> Completed</h2>
                        <span class="task-count" id="completedCount">0</span>
                    </div>
                    <div class="task-list" id="completedTasksList"></div>
                </div>

            </section>

        </main>
    </div>

    <script src="script.js"></script>
</body>
</html>
